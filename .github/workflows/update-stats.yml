name: Update project statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '18 5 * * *'

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh download and follower statistics
        run: python scripts/update_stats.py
      - name: Commit refreshed statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh README project stats'
            git push
          fi
